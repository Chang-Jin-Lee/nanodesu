name: Update Trend Report

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

concurrency:
  group: update-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sources
        run: python -m scripts.fetch_all

      - name: Sync watchlist from AniList trending
        run: python -m scripts.sync_watchlist

      - name: Extract mentions
        run: python -m scripts.extract_mentions

      - name: Rank trends
        run: python -m scripts.rank_trends

      - name: Build events
        run: python -m scripts.build_events

      - name: Render reports
        run: python -m scripts.render_reports

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports README.md config/watchlist.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trend report [skip ci]"
            git push
          fi
